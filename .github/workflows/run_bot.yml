name: Run Crypto AI Bot

on:
  schedule:
    # This runs the bot automatically every 1 hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to run it manually with a click anytime

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas google-genai

      - name: Run the trading bot
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
